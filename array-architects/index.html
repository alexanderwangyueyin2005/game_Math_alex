<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f1e9">
    <title>Array Architects · Logifera</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9ece2; color: #213c38; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
      header { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { font-size: 22px; font-weight: 650; letter-spacing: -.8px; }
      .category { color: #63746f; font-size: 13px; letter-spacing: .02em; }
      main { padding: 4px 0 22px; }
      footer { padding: 0 0 22px; color: #6c7e77; display: flex; justify-content: space-between; font-size: 12px; gap: 20px; }
      @media(max-width: 600px) { .shell { width: calc(100% - 24px); } header { height: 66px; } footer { line-height: 1.6; } }
    </style>
    <script defer src="adaptive-engine.js"></script>
    <script defer src="telemetry.js"></script>
    <script defer src="array-architects.js"></script>
  </head>
  <body>
    <div class="shell">
      <header><span class="brand">Logifera</span><span class="category">MATHEMATICAL PLAY / 021</span></header>
      <main><array-architects></array-architects></main>
      <footer><span>Make the mathematics move.</span><span>Explore at your own pace.</span></footer>
    </div>
    <noscript>This game needs JavaScript enabled.</noscript>
  </body>
</html>
